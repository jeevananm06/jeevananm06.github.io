<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found | Jeevanantham Govindaraju</title>
  <link rel="icon" type="image/x-icon" href="img/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .error-container {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .error-code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 5rem;
      font-weight: 800;
      color: var(--accent-text);
      line-height: 1;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-code">404</div>
    <h1 style="font-size: 1.75rem; margin-bottom: 0.75rem;">Page Not Found</h1>
    <p style="color: var(--text-secondary); max-width: 460px; margin-bottom: 2rem;">
      The page you are looking for doesn't exist or has been moved as part of the portfolio upgrade.
    </p>
    <a href="/" class="btn btn-primary">
      Return Home
    </a>
  </div>
  <script src="js/main.js"></script>
</body>
</html>
